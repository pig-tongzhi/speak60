    "为什么要写测试": ["给出你最有说服力的一条理由", "反方会怎么反驳，你怎么回应"],
    "技术选型该听谁的": ["你的判断标准是什么", "最容易被谁带偏"],
    "一个人能不能维护一个产品": ["你的判断是什么", "哪一步最先撑不住"],
    "架构的演进而非设计": ["你同意吗？为什么", "什么时候「设计」反而有害"],
    "删掉代码的勇气": ["你删过的最有价值的一段代码是什么", "什么在阻碍你删"],
    "教别人是最好的学习": ["你同意吗？为什么", "教的时候最容易漏掉什么"],
    "先报价还是先聊": ["你的做法是什么", "哪种客户适合反过来"],
    "合同与预付款": ["你怎么收预付款比例", "客户不付预付款时你怎么办"],
  };

  // 取某道题的问句。没有配问句的题目返回空串（卡片照常显示话题词）。
  function promptFor(topic) {
    if (!topic) return "";
    if (QOVERRIDE[topic]) {
      var arr = QOVERRIDE[topic];
      return arr[Math.floor(Math.random() * arr.length)];
    }
    var kind = QMETA[topic];
    if (!kind || !QPOOL[kind]) return "";
    var pool = QPOOL[kind];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  /* ============================================================
     练习记录
     只记「点了开始计时」的练习（抽了没讲的不算）。
     一条记录在计时结束时落库，因为时长和是否讲完只有结束才知道。
     上限 1000 条，超出丢最旧的。
     ============================================================ */
  var HISTORY_MAX = 1000;

  function loadHistory() {
    try {
      var raw = localStorage.getItem(PREFIX + "history");
      if (!raw) return [];
      var list = JSON.parse(raw);
      return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
  }

  function saveHistory() {
    try {
      localStorage.setItem(PREFIX + "history", JSON.stringify(state.history));
      return true;
    } catch (e) {
      // 配额满或隐私模式：退回只留最近 200 条再试一次
      try {
        state.history = state.history.slice(-200);
        localStorage.setItem(PREFIX + "history", JSON.stringify(state.history));
        return true;
      } catch (e2) { return false; }
    }
  }

  // 记录某次练习。startedAt 是点开始的时间，durationSec 是实际讲了多久。
  function recordPractice(info) {
    var rec = {
      id: (info.startedAt || Date.now()) + "-" + Math.floor(Math.random() * 1e4),
      at: new Date(info.startedAt || Date.now()).toISOString(),
      topic: String(info.topic || ""),
      prompt: info.prompt || "",     // 当时抽到的限定问句
      category: info.category || "",
      mode: info.mode || "off-the-cuff",
      targetSec: info.targetSec || 0,
      durationSec: Math.max(0, Math.round(info.durationSec || 0)),
      completed: !!info.completed,
      extended: Math.max(0, info.extended || 0)
    };
    state.history.push(rec);
    if (state.history.length > HISTORY_MAX) {
      state.history = state.history.slice(-HISTORY_MAX);
    }
    var saved = saveHistory();
    renderHistoryButton();
    return saved ? rec : null;
  }

  // 今天 / 本周 / 连续天数（按本地日期算，不用 UTC，避免跨时区错位）
  function dayKey(d) {
    var x = d instanceof Date ? d : new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") +
      "-" + String(x.getDate()).padStart(2, "0");
  }

  function historyStats() {
    var list = state.history;
    var today = dayKey(new Date());
    var week = 0, todayCount = 0, totalSec = 0;
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6);
    var weekStart = new Date(weekAgo.getFullYear(), weekAgo.getMonth(), weekAgo.getDate()).getTime();

    var days = {};
    list.forEach(function (r) {
      var t = new Date(r.at).getTime();
      var k = dayKey(r.at);
      days[k] = (days[k] || 0) + 1;
      if (k === today) todayCount++;
      if (t >= weekStart) week++;
      totalSec += r.durationSec || 0;
    });

    // 连续天数：从今天往回数（今天没练则从昨天起算，仍显示当前连续）
    var streak = 0;
    var cursor = new Date();
    if (!days[dayKey(cursor)]) cursor.setDate(cursor.getDate() - 1);
    for (var i = 0; i < 3660; i++) {
      if (days[dayKey(cursor)]) { streak++; cursor.setDate(cursor.getDate() - 1); }
      else break;
    }

    var done = list.filter(function (r) { return r.completed; }).length;
    return {
      total: list.length,
      today: todayCount,
      week: week,
      streak: streak,
      totalSec: totalSec,
      completed: done,
      completionRate: list.length ? Math.round((done / list.length) * 100) : 0
    };
  }

  function fmtDuration(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s2 = sec % 60;
    if (m && s2) return m + " 分 " + s2 + " 秒";
    if (m) return m + " 分";
    return s2 + " 秒";
  }


  /* ============================================================
     音效
     ============================================================ */

  // 先不创建：iOS 要求在用户手势里创建，否则实例可能一直 suspended
  var audioCtx = null;

  function tone(freqs, duration) {
    if (state.muted) return;
    ensureAudio(function (ctx) {
      try {
        var now = ctx.currentTime;
        var each = duration / freqs.length;
        freqs.forEach(function (f, i) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = f;
          var start = now + i * each;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + each);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + each + 0.02);
        });
      } catch (e) {}
    });
  }

  // iOS Safari 要求 AudioContext 必须在一次真实用户手势里被创建或恢复，
  // 之后才允许出声。所以每次点击都主动解锁一次（幂等，代价极低）。
  var audioPending = [];

  // 在用户手势里调用。三件事缺一不可：
  //   1) 在手势里创建 AudioContext——iOS 上不在手势里创建的实例经常起不来
  //   2) resume()
  //   3) 播一个 1 帧的静音缓冲「预热」——iOS Safari 靠这个把音频硬件唤醒，
  //      不做的话第一声常常是哑的
  function unlockAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) {
        audioCtx = new Ctx();
        try {
          var b = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
          var src = audioCtx.createBufferSource();
          src.buffer = b;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (e) {}
      }
      if (audioCtx.state !== "running" && audioCtx.resume) {
        var pr = audioCtx.resume();
        // resume 一旦落定就直接补发，不再拿 state 当闸门：
        // 某些浏览器 resolve 了但 state 还没翻过来，用 state 判断会让声音永远发不出去
        if (pr && pr.then) pr.then(drainAudioPending, function () { drainAudioPending(); });
      }
      drainAudioPending();
      return audioCtx;
    } catch (e) { return null; }
  }

  // 上下文恢复后，把排队中的发声补上（不发就等于永远哑着）
  function drainAudioPending() {
    if (!audioPending.length) return;
    var q = audioPending;
    audioPending = [];
    for (var i = 0; i < q.length; i++) {
      try { q[i](audioCtx); } catch (e) {}
    }
  }

  // 要发声就调这个。上下文没起来就先排队，起来了再补发。
  function ensureAudio(cb) {
    var ctx = unlockAudio();
    if (!ctx) return;
    if (ctx.state === "running") { cb(ctx); return; }
    audioPending.push(cb);
    // 兜底：有些浏览器 resume 的 Promise 不 settle，靠这个轮询补发
    var tries = 0;
    (function wait() {
      if (audioCtx && audioCtx.state === "running") { drainAudioPending(); return; }
      if (++tries > 40) { audioPending = []; return; }
      setTimeout(wait, 100);
    })();
  }

  function buzz(pattern) {
    if (state.muted || alerting) return;
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) {}
  }

  // 时间到的重复提醒：只响一次很容易被忽略，尤其是戴着耳机或正在讲话时
  var alertTick = null;
  var alerting = false;

  function startAlert() {
    if (state.muted) return;
    stopAlert();
    try {
      if (!navigator.vibrate) return;
      alerting = true;
      navigator.vibrate([80, 90, 80]);
      alertTick = setInterval(function () {
        try { navigator.vibrate([80, 90, 80]); } catch (e) {}
      }, 2500);
    } catch (e) { alerting = false; }
  }

  function stopAlert() {
    alerting = false;
    if (alertTick !== null) { clearInterval(alertTick); alertTick = null; }
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
  }

  /* ---------- 抽题时的「哒」声 ----------
     走过一格 = 一声清脆的点击。
     合成方式：三角波（比正弦多点泛音，才有木质感）+ 极短的起音噪声，
     音高轻微下滑。不带持续噪声——带通滤波的噪声会变成"机械摩擦"声，
     那是另一种东西。 */
  // 两声「哒」之间的最短间隔随转盘速度变化，这是"快到停"听感的关键：
  // 固定间隔会让声音与画面脱节——画面在减速，声音却匀速。
  // 最快 45ms（约 22 声/秒），最慢 340ms（约 3 声/秒）。
  // 指数 1.55 让尾部拉得更开，不是线性变慢。
  var TICK_GAP_FAST = 45;
  var TICK_GAP_SLOW = 340;
  var lastTickWall = -1e9;
  var noiseBuf = null;

  function tickGapFor(rate) {
    var k = 1 - Math.max(0, Math.min(1, rate));
    return TICK_GAP_FAST + (TICK_GAP_SLOW - TICK_GAP_FAST) * Math.pow(k, 1.55);
  }

  // 音色档位（参数由试听页调出来后写死）
  var TONES = {
    crisp:  { name: "清脆", p: { freq: 2180, decay: 0.053, tone: 1, click: 0.46, noise: 0, gain: 0.9, bend: 1.06 } },
    wood:   { name: "木质", p: { freq: 1400, decay: 0.075, tone: 1, click: 0.40, noise: 0.06, gain: 1.0, bend: 1.04 } },
    light:  { name: "轻巧", p: { freq: 2650, decay: 0.032, tone: 0, click: 0.34, noise: 0, gain: 0.85, bend: 1.08 } },
    muted:  { name: "低沉", p: { freq: 980, decay: 0.060, tone: 1, click: 0.32, noise: 0.04, gain: 1.0, bend: 1.03 } },
    soft:   { name: "柔和", p: { freq: 1750, decay: 0.095, tone: 0, click: 0.26, noise: 0, gain: 1.0, bend: 1.05 } }
  };
  var DEFAULT_TONE = "crisp";

  function toneDef(id) { return TONES[id] || TONES[DEFAULT_TONE]; }

  function getNoiseBuf(ctx) {
    if (noiseBuf && noiseBuf.sampleRate === ctx.sampleRate) return noiseBuf;
    var len = Math.floor(ctx.sampleRate * 0.06);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = buf;
    return buf;
  }

  // rate: 1=转得最快，0=即将停。音量与音高随之微调，听感跟着减速走
  function playTick(rate, silent) {
    if (state.muted || !state.spinSound) return;
    // 快速滚动阶段一秒走过几百格，必须节流，否则叠成噪音。
    // 间隔随 rate 变化，音频才跟着转盘一起慢下来。
    // 用 performance.now() 而不是 ctx.currentTime：音频时钟只用于调度，
    // 拿它做节流会因两者速率不同而失效。
    var wall = performance.now();
    if (!silent) {
      if (wall - lastTickWall < tickGapFor(rate)) return;
      lastTickWall = wall;
    }

    ensureAudio(function (ctx) {
      try {
        var P = toneDef(state.spinTone).p;
        var t = ctx.currentTime;
        var amp = P.gain * (0.62 + 0.38 * rate);
        var master = ctx.createGain();
        master.gain.value = amp;
        master.connect(ctx.destination);

        // 起音敲击：极短噪声，给一个"硬"的起始
        if (P.click > 0.01) {
          var src = ctx.createBufferSource();
          src.buffer = getNoiseBuf(ctx);
          var bp = ctx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = P.freq * 2.4;
          bp.Q.value = 0.9;
          var cg = ctx.createGain();
          cg.gain.setValueAtTime(P.click, t);
          cg.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(0.012, P.decay * 0.5));
          src.connect(bp); bp.connect(cg); cg.connect(master);
          src.start(t); src.stop(t + 0.03);
        }

        // 音调本体：音高轻微下滑
        if (P.tone !== 2) {
          var osc = ctx.createOscillator();
          osc.type = P.tone === 1 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(P.freq * P.bend, t);
          osc.frequency.exponentialRampToValueAtTime(P.freq, t + P.decay * 0.7);
          var g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(1, t + 0.0015);
          g.gain.exponentialRampToValueAtTime(0.0001, t + P.decay);
          osc.connect(g); g.connect(master);
          osc.start(t); osc.stop(t + P.decay + 0.02);
        }

        // 噪声成分（木质档用一点）
        if (P.noise > 0.01) {
          var s2 = ctx.createBufferSource();
          s2.buffer = getNoiseBuf(ctx);
          var lp = ctx.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = P.freq * 3;
          var ng = ctx.createGain();
          ng.gain.setValueAtTime(P.noise, t);
          ng.gain.exponentialRampToValueAtTime(0.0001, t + P.decay);
          s2.connect(lp); lp.connect(ng); ng.connect(master);
          s2.start(t); s2.stop(t + P.decay + 0.02);
        }
      } catch (e) {}
    });
  }

  // 「哒」是单发音，没有持续音要停。保留这个函数是为了在
  // 关掉开关 / 静音 / 中断抽题时统一收口，以后若加持续音也有地方停。
  function stopSpinSound() {}

  function toneLand() { tone([660, 880], 0.24); buzz(35); }
  function toneStart() { tone([520, 780], 0.26); buzz(25); }
  function toneDone() { tone([880, 660, 440], 0.6); }

  /* ============================================================
     状态
     ============================================================ */

  // 读取开启的分类：非法值、空数组都退回「全部开启」
  function loadNiches() {
    var raw = load("enabled", null);
    if (raw === null) return ALL_NICHE_IDS.slice();
    var list = String(raw).split(",").filter(function (id) {
      return ALL_NICHE_IDS.indexOf(id) >= 0;
    });
    return list.length ? list : ALL_NICHE_IDS.slice();
  }

  function saveNiches() {
    save("enabled", state.enabled.join(","));
  }

  // 当前生效的分类（顺序始终跟 NICHES 一致，避免下拉菜单跳动）
  function enabledNiches() {
    return NICHES.filter(function (n) { return state.enabled.indexOf(n.id) >= 0; });
  }

  // 抽题池：合并后每题等概率。
  // 之所以不「先随机选分类再随机选题」，是因为各分类题量不等（47~86），
  // 那样小分类会被过度放大。
  // scope=all 时用全部分类；scope=custom 时只用勾选的分类。
  function scopeNiches() {
    if (state.scope === "all") return NICHES.slice();
    var on = enabledNiches();
    return on.length ? on : NICHES.slice();
  }

  // 去重兜底：万一以后两个分类出现同名题目，也不会在同一轮里被抽到两次
  var _poolCache = null;
  var _poolKey = "";
  function activePool() {
    var list = scopeNiches();
    var key = state.scope + "|" + list.map(function (n) { return n.id; }).join(",");
    if (_poolCache && _poolKey === key) return _poolCache;
    var seen = {};
    var pool = [];
    list.forEach(function (n) {
      n.topics.forEach(function (t) {
        if (!seen[t]) { seen[t] = 1; pool.push(t); }
      });
    });
    _poolCache = pool;
    _poolKey = key;
    return pool;
  }

  /* ---------- 分类开关 ---------- */

  // 保证至少留一个分类，避免抽题池变空
  function ensureMinNiches() {
    if (state.enabled.length >= 1) return true;
    var keep = NICHES.some(function (n) { return n.id === state.niche; })
      ? state.niche : NICHES[0].id;
    state.enabled = [keep];
    return false;
  }

  function toggleNiche(id) {
    // 从「全部」切到自定义时，勾选集合先清空：
    // 此时 enabled 里装着全部分类，如果直接 toggle，点「文学」会变成「取消文学、
    // 保留其余 11 类」，与「我要练文学」的意图正好相反。
    if (state.scope === "all") {
      state.enabled = [id];
      state.scope = "custom";
      save("scope", state.scope);
    } else {
      var at = state.enabled.indexOf(id);
      if (at >= 0) {
        if (state.enabled.length === 1) return false;   // 最后一个不给关
        state.enabled.splice(at, 1);
      } else {
        state.enabled.push(id);
      }
    }
    // 顺序对齐 NICHES，菜单与列表才稳定
    state.enabled = ALL_NICHE_IDS.filter(function (x) {
      return state.enabled.indexOf(x) >= 0;
    });
    saveNiches();

    // 当前选中的分类被关掉了，就落到第一个还开着的分类
    if (state.enabled.indexOf(state.niche) < 0) state.niche = state.enabled[0];

    if (state.mode !== "deep-research") {
      lastIndex = 0;
      setTopic(pick(activePool()));
    }
    renderAll();
    updateNicheMenu();
    return true;
  }

  // 一键全选 = 回到「所有分类混合」
  function toggleAllNiches(on) {
    state.enabled = on ? ALL_NICHE_IDS.slice() : [state.niche];
    if (state.enabled.indexOf(state.niche) < 0) state.enabled = [NICHES[0].id];
    state.niche = state.enabled.indexOf(state.niche) >= 0 ? state.niche : state.enabled[0];
    state.scope = on ? "all" : "custom";
    save("scope", state.scope);
    saveNiches();
    if (state.mode !== "deep-research") {
      lastIndex = 0;
      setTopic(pick(activePool()));
    }
    renderAll();
    updateNicheMenu();
  }

  function setScopeAll() {
    state.scope = "all";
    state.enabled = ALL_NICHE_IDS.slice();
    save("scope", "all");
    saveNiches();
    if (state.mode !== "deep-research") {
      lastIndex = 0;
      setTopic(pick(activePool()));
    }
    renderAll();
    updateNicheMenu();
  }

  function paletteExists(id) {
    return PALETTES.some(function (p) { return p.id === id; });
  }

  // 全部开启作为默认；用户可在设置里关掉不想练的分类
  var ALL_NICHE_IDS = NICHES.map(function (n) { return n.id; });

  var state = {
    mode: load("mode", "off-the-cuff"),
    niche: load("niche", NICHES[0].id),
    // scope: "all" = 所有分类混合抽题（默认）；"custom" = 只在勾选的分类里抽
    scope: load("scope", "all") === "custom" ? "custom" : "all",
    enabled: loadNiches(),
    theme: document.documentElement.dataset.theme === "light" ? "light" : "dark",
    palette: load("palette", DEFAULT_PALETTE),
    speechSeconds: clamp(Number(load("speech", 60)) || 60, 30, 900),
    researchSeconds: clamp(Number(load("research", 600)) || 600, 60, 3600),
    muted: loadBool("muted", false),
    // 抽题时的齿轮声单独可控（有人觉得吵，但想保留到点提示音）
    spinSound: loadBool("spinSound", true),
    spinTone: TONES[load("spinTone", DEFAULT_TONE)] ? load("spinTone", DEFAULT_TONE) : DEFAULT_TONE,
    history: loadHistory(),
    // 本次练习的起点信息，计时结束时用来落一条记录
    session: null,
    topic: null,
    prompt: "",          // 当前题目的限定问句
    spinning: false,
    phase: "idle",
    remaining: 60,
    elapsed: 0
  };
  if (!paletteExists(state.palette)) state.palette = DEFAULT_PALETTE;

  function nicheById(id) {
    if (id === RESEARCH.id) return RESEARCH;
    for (var i = 0; i < NICHES.length; i++) if (NICHES[i].id === id) return NICHES[i];
    return NICHES[0];
  }
  function modeById(id) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i];
    return MODES[0];
  }
  // 抽题范围只由「设置里勾选的分类 / 顶部下拉选中的分类」决定，两种模式一致。
  // 模式不再偷偷换题库——「选了文学、先查再讲却抽出认知偏误」就是这么来的。
  function activeTopics() {
    return activePool();
  }
  function activeNiche() {
    return nicheById(state.niche);
  }

  /* ============================================================
     DOM 引用
     ============================================================ */

  var el = {
    stage: $("stage"),
    modeThumb: $("modeThumb"),
    modeBlurb: $("modeBlurb"),
    modeOptions: Array.prototype.slice.call(document.querySelectorAll(".mode-option")),
    niche: $("niche"),
    nicheTrigger: $("nicheTrigger"),
    nicheEmoji: $("nicheEmoji"),
    nicheLabel: $("nicheLabel"),
    nicheCount: $("nicheCount"),
    nicheMenu: $("nicheMenu"),
    reel: $("reel"),
    reelEyebrow: $("reelEyebrow"),
    reelPhrase: $("reelPhrase"),
    reelPrompt: $("reelPrompt"),
    spinBtn: $("spinBtn"),
    startBtn: $("startBtn"),
    settingsBtn: $("settingsBtn"),
    historyBtn: $("historyBtn")
  };

  var spinTick = null;
  var spinGuard = null;
  var tickId = null;
  var lastIndex = 0;
  var overlay = null;

  var SPIN_MS = Number(window.__SPEAK60_SPIN_MS) || 4600;

  /* ============================================================
     渲染
     ============================================================ */

  function isBusy() { return state.spinning || state.phase !== "idle"; }

  el.settingsBtn.innerHTML = I.gear + "<span>设置</span>";

  // 记录按钮带上条数角标，一眼能看出练了多少次
  function renderHistoryButton() {
    if (!el.historyBtn) return;
    var n = state.history.length;
    el.historyBtn.innerHTML = I.clock + "<span>记录</span>" +
      (n ? '<span class="history-badge">' + (n > 99 ? "99+" : n) + "</span>" : "");
    el.historyBtn.setAttribute("aria-label", n ? "练习记录，共 " + n + " 条" : "练习记录，暂无");
  }
  el.nicheEmoji.innerHTML = I.spark;
  document.querySelector(".niche-caret").innerHTML = I.caret;

  function renderModeSwitch() {
    var idx = 0;
    el.modeOptions.forEach(function (btn, i) {
      var on = btn.dataset.mode === state.mode;
      if (on) idx = i;
      btn.classList.toggle("is-active", on);
      btn.setAttribute("aria-checked", on ? "true" : "false");
      btn.tabIndex = on ? 0 : -1;
      btn.disabled = isBusy();
    });
    el.modeThumb.style.setProperty("--i", idx);
    el.modeBlurb.textContent = modeById(state.mode).blurb;
  }

  function renderNiche() {
    var n = activeNiche();
    var on = enabledNiches();
    var scope = scopeNiches();
    var count = activePool().length;
    if (state.scope === "all") {
      // 默认：所有分类混合
      el.nicheEmoji.innerHTML = I.layers;
      el.nicheLabel.textContent = "全部";
      el.nicheCount.textContent = NICHES.length + " 类 · " + count + " 题";
    } else {
      if (state.enabled.indexOf(state.niche) < 0) state.niche = state.enabled[0];
      n = nicheById(state.niche);
      el.nicheEmoji.innerHTML = n.icon || I.spark;
      el.nicheLabel.textContent = on.length > 1 ? n.label + " 等 " + on.length + " 类" : n.label;
      el.nicheCount.textContent = count + " 题";
    }
    el.nicheTrigger.disabled = isBusy();
  }

  function updateNicheMenu() {
    if (!el.nicheMenu.hidden) buildMenu();
  }

  function renderReel() {
    el.reel.classList.toggle("is-spinning", state.spinning);
    el.reel.classList.toggle("is-landed", !state.spinning && !!state.topic);
    if (state.spinning) el.reelEyebrow.textContent = "抽题中…";
    else if (state.topic) el.reelEyebrow.textContent = "你的题目";
    else el.reelEyebrow.textContent = "准备就绪";
  }

  function renderButtons() {
    var busy = isBusy();
    el.spinBtn.disabled = busy;
    el.spinBtn.innerHTML = I.spin +
      "<span>" + (state.spinning ? "抽题中…" : (state.topic ? "换一个" : "抽一个题")) + "</span>";
    el.startBtn.disabled = busy || !state.topic;
    el.startBtn.textContent = state.mode === "deep-research"
      ? "开始 " + fmtText(state.researchSeconds) + " 研究"
      : "开始 " + fmtText(state.speechSeconds) + " 计时";
    el.settingsBtn.disabled = busy;
  }

  function renderAll() {
    renderModeSwitch();
    renderNiche();
    renderReel();
    renderButtons();
  }

  /* ============================================================
     领域下拉
     ============================================================ */

  function buildMenu() {
    el.nicheMenu.innerHTML = "";
    var isAll = state.scope === "all";

    // 顶部固定一行「全部（混合抽题）」：否则选了具体分类后，
    // 菜单里只剩那一项，用户没有路径切回全部（也没法换别的分类）
    var allRow = document.createElement("div");
    allRow.className = "niche-option is-all-option" + (isAll ? " is-active" : "");
    allRow.setAttribute("role", "option");
    allRow.setAttribute("aria-selected", isAll ? "true" : "false");
    allRow.tabIndex = -1;
    allRow.dataset.id = "__all__";
    var allCount = NICHES.reduce(function (a, n) { return a + n.topics.length; }, 0);
    allRow.innerHTML = '<span class="niche-emoji" aria-hidden="true">' + I.layers +
      '</span><span class="niche-label">全部（混合抽题）</span>' +
      '<span class="niche-count">' + NICHES.length + " 类 · " + allCount + "</span>";
    allRow.addEventListener("click", function () { selectAllFromMenu(); });
    el.nicheMenu.appendChild(allRow);

    // 其余分类始终全部列出（不再只列当前范围的），点任意一个即切到「只看它」
    NICHES.forEach(function (n) {
      var row = document.createElement("div");
      var on = !isAll && state.enabled.indexOf(n.id) >= 0;
      row.className = "niche-option" + (on ? " is-active" : "");
      row.setAttribute("role", "option");
      row.setAttribute("aria-selected", on ? "true" : "false");
      row.tabIndex = -1;
      row.dataset.id = n.id;
      row.innerHTML = '<span class="niche-emoji" aria-hidden="true">' + (n.icon || I.spark) +
        '</span><span class="niche-label">' + n.label +
        '</span><span class="niche-count">' + n.topics.length + "</span>";
      row.addEventListener("click", function () { chooseNiche(n.id); });
      el.nicheMenu.appendChild(row);
    });
  }

  function selectAllFromMenu() {
    setScopeAll();
    closeMenu(true);
  }

  // 按实际可用空间决定菜单高度与展开方向：
  // 「最后一项能不能点到」不该取决于屏幕够不够高。
  function fitMenu() {
    var vh = window.innerHeight;
    var rect = el.nicheTrigger.getBoundingClientRect();
    var GAP = 7;
    var MARGIN = 12;
    var below = vh - rect.bottom - GAP - MARGIN;
    var above = rect.top - GAP - MARGIN;
    var menuH = el.nicheMenu.scrollHeight;

    // 优先向下；只有下方放不下、且上方更宽裕时才向上翻
    var flip = menuH > below && above > below;
    el.niche.classList.toggle("is-flip", flip);
    var avail = flip ? above : below;
    // 上限 78% 视口高：大屏手机上 12 项能一次看完，又不至于完全盖住主内容
    var cap = Math.round(vh * 0.78);
    var max = Math.max(180, Math.min(avail, cap));
    el.nicheMenu.style.setProperty("--menu-max", max + "px");
  }

  function openMenu() {
    if (isBusy()) return;
    buildMenu();
    el.nicheMenu.hidden = false;
    el.niche.classList.add("is-open");
    el.nicheTrigger.setAttribute("aria-expanded", "true");
    // 先显示才能量到真实高度，再据此定高
    fitMenu();
    var first = el.nicheMenu.querySelector(".niche-option.is-active") ||
      el.nicheMenu.querySelector(".niche-option");
    if (first) first.focus();
  }

  function closeMenu(focusTrigger) {
    el.nicheMenu.hidden = true;
    el.niche.classList.remove("is-open");
    el.nicheTrigger.setAttribute("aria-expanded", "false");
    if (focusTrigger) el.nicheTrigger.focus();
  }

  function chooseNiche(id) {
    state.niche = id;
    save("niche", id);
    // 从下拉里选一个分类 = 只看这一类，否则在「全部」范围下选了也不生效，
    // 用户会以为没反应
    if (state.mode !== "deep-research") {
      state.scope = "custom";
      state.enabled = [id];
      save("scope", state.scope);
      saveNiches();
    }
    closeMenu(true);
    lastIndex = 0;
    setTopic(pick(activeTopics()));
    renderAll();
  }

  el.nicheTrigger.addEventListener("click", function () {
    if (el.nicheMenu.hidden) openMenu(); else closeMenu(true);
  });
  el.nicheTrigger.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (el.nicheMenu.hidden) openMenu();
    }
  });
  el.nicheMenu.addEventListener("keydown", function (e) {
    var rows = Array.prototype.slice.call(el.nicheMenu.querySelectorAll(".niche-option"));
    var at = rows.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); rows[Math.min(rows.length - 1, at + 1)].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); rows[Math.max(0, at - 1)].focus(); }
    else if (e.key === "Home") { e.preventDefault(); rows[0].focus(); }
    else if (e.key === "End") { e.preventDefault(); rows[rows.length - 1].focus(); }
    else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (!rows[at]) return;
      if (rows[at].dataset.id === "__all__") selectAllFromMenu();
      else chooseNiche(rows[at].dataset.id);
    } else if (e.key === "Escape") { e.preventDefault(); closeMenu(true); }
    else if (e.key === "Tab") { closeMenu(false); }
  });
  document.addEventListener("mousedown", function (e) {
    if (!el.niche.hidden && !el.niche.contains(e.target)) closeMenu(false);
  });

  /* ============================================================
     模式切换
     ============================================================ */

  el.modeOptions.forEach(function (btn) {
    btn.addEventListener("click", function () { setMode(btn.dataset.mode); });
    btn.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        e.preventDefault();
        setMode(MODES[(el.modeOptions.indexOf(btn) + 1) % MODES.length].id, true);
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        var j = el.modeOptions.indexOf(btn);
        setMode(MODES[(j - 1 + MODES.length) % MODES.length].id, true);
      }
    });
  });

  function setMode(id, focus) {
    if (isBusy() || id === state.mode) return;
    state.mode = id;
    save("mode", id);
    lastIndex = 0;
    setTopic(pick(activeTopics()));
    renderAll();
    if (focus) {
      el.modeOptions.forEach(function (b) { if (b.dataset.mode === id) b.focus(); });
    }
  }

  function setTopic(topic) {
    state.topic = topic == null ? topic : String(topic);
    state.prompt = topic ? promptFor(String(topic)) : "";
    el.reelPhrase.textContent = topic;
    renderPrompt();
  }

  // 卡片上只有话题词，问句作为「副行」显示在下面（不改变卡片字数）
  function renderPrompt() {
    if (!el.reelPrompt) return;
    el.reelPrompt.textContent = state.prompt || "";
    el.reelPrompt.hidden = !state.prompt;
  }

  /* ============================================================
     抽题转盘
     ============================================================ */

  function clearSpin() {
    if (spinTick !== null) { clearInterval(spinTick); spinTick = null; }
    if (spinGuard !== null) { clearTimeout(spinGuard); spinGuard = null; }
    stopSpinSound();
  }

  function spin() {
    if (isBusy()) return;
    clearSpin();
    state.spinning = true;
    state.topic = null;
    renderAll();
    lastTickWall = -1e9;

    var topics = activeTopics();
    var total = topics.length;
    var startIdx = Math.floor(Math.random() * total);

    // 老虎机式：每一格恰好配一声「哒」，用同一条减速曲线决定何时推进下一格。
    // 所以声音与画面严格同步——一起由密变疏、一起停住。
    // 间隔序列：第 k 格的间隔取 t=(k/count) 处的值，形成 45ms→340ms 的缓出。
    // 累加直到刚好填满 SPIN_MS，于是转盘时长仍然固定。
    var EST = 60;
    var gaps = [];
    for (var k = 0; k < EST; k++) gaps.push(tickGapFor(1 - k / EST));
    var stepCount = 0, acc = 0;
    while (stepCount < EST && acc + gaps[stepCount] <= SPIN_MS) {
      acc += gaps[stepCount];
      stepCount++;
    }
    if (stepCount < 6) stepCount = Math.min(6, total);   // 兜底：至少滚几格

    var finalIdx = (startIdx + stepCount) % total;
    var elapsed = 0;
    var nextAt = gaps[0];
    var stepsLeft = stepCount;
    var settled = false;
    var started = performance.now();

    function settle() {
      if (settled) return;
      settled = true;
      clearSpin();
      stopSpinSound();
      lastIndex = finalIdx;
      state.spinning = false;
      setTopic(topics[finalIdx]);
      renderAll();
      toneLand();
    }

    function frame() {
      if (settled) return;
      elapsed = performance.now() - started;
      // while：间隔最短 45ms，而帧间隔约 16ms，极端情况下可能一帧要推两格
      while (stepsLeft > 0 && elapsed >= nextAt) {
        stepsLeft--;
        var idx = (finalIdx - stepsLeft + total) % total;
        lastIndex = idx;
        el.reelPhrase.textContent = topics[idx];
        // 自己在这里发声，保证「一声一格」严格对齐
        playTick(Math.max(0, 1 - elapsed / SPIN_MS), true);
        if (stepsLeft === 0) break;
        var done = stepCount - stepsLeft;          // 已推进的格数
        nextAt += gaps[done] || tickGapFor(0);
      }
      if (stepsLeft <= 0) { settle(); return; }
      if (elapsed >= SPIN_MS + 120) { settle(); return; }
    }

    spinTick = setInterval(frame, 16);
    frame();
    spinGuard = setTimeout(settle, SPIN_MS + 600);
  }

  el.spinBtn.addEventListener("click", function () { unlockAudio(); spin(); });

  /* ============================================================
     计时器
     ============================================================ */

  function stopTick() {
    if (tickId !== null) { clearInterval(tickId); tickId = null; }
  }

  function countdown(seconds, onTick, onEnd) {
    stopTick();
    var endAt = Date.now() + seconds * 1000;
    tickId = setInterval(function () {
      var left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      onTick(left);
      if (left <= 0) { stopTick(); onEnd(); }
    }, 100);
    onTick(seconds);
  }

  // 找出某道题属于哪个分类（用于记录里标注）
  function categoryOfTopic(topic) {
    for (var i = 0; i < NICHES.length; i++) {
      if (NICHES[i].topics.indexOf(topic) >= 0) return NICHES[i].label;
    }
    return "";
  }

  function startSession() {
    if (!state.topic || isBusy()) return;
    closeMenu(false);
    // 只有「点了开始计时」才建立记录起点；抽了没讲的不记
    state.session = {
      startedAt: Date.now(),
      topic: state.topic,
      prompt: state.prompt || "",
      category: categoryOfTopic(state.topic),
      mode: state.mode,
      targetSec: state.mode === "deep-research" ? state.researchSeconds : state.speechSeconds,
      extended: 0,
      speechStartedAt: state.mode === "deep-research" ? null : Date.now()
    };
    if (state.mode === "deep-research") beginResearch();
    else beginSpeech();
  }

  // 计时结束时落一条记录。spokenSecOverride 用于研究模式：真正「讲」的时长。
  function commitSession(completed, spokenSecOverride) {
    var se = state.session;
    if (!se) return;
    var spoken;
    if (typeof spokenSecOverride === "number") spoken = spokenSecOverride;
    else spoken = (Date.now() - (se.speechStartedAt || se.startedAt)) / 1000;
    recordPractice({
      startedAt: se.startedAt,
      topic: se.topic,
      prompt: se.prompt,          // 漏了这个字段，记录里就丢了问句
      category: se.category,
      mode: se.mode,
      targetSec: se.targetSec,
      durationSec: spoken,
      completed: !!completed,
      extended: se.extended
    });
    state.session = null;
  }

  el.startBtn.addEventListener("click", function () { unlockAudio(); startSession(); });

  /* ============================================================
     全屏计时遮罩
     ============================================================ */

  var RING_R = 84;
  var RING_C = 2 * Math.PI * RING_R;

  function buildOverlay(opts) {
    destroyOverlay();
    var wrap = document.createElement("div");
    wrap.className = "timer";
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-modal", "true");

    var cueHtml = "";
    if (opts.cues) {
      cueHtml = '<div class="cues">' + CUES.map(function (c, i) {
        return '<span class="cue" data-cue="' + i + '">' + c + "</span>";
      }).join("") + "</div>";
    }

    wrap.innerHTML =
      '<p class="timer-label">' + opts.label + "</p>" +
      '<p class="timer-topic">' + escapeHtml(state.topic || "") + "</p>" +
      (state.prompt ? '<p class="timer-prompt">' + escapeHtml(state.prompt) + "</p>" : "") +
      '<div class="timeup" id="timeup">' +
        '<p class="timeup-title" id="timeupTitle">时间到</p>' +
        '<p class="timeup-sub" id="timeupSub"></p>' +
      "</div>" +
      '<div class="ring-wrap">' +
        '<svg class="ring" viewBox="0 0 200 200" aria-hidden="true">' +
          '<circle class="track" cx="100" cy="100" r="' + RING_R + '"></circle>' +
          '<circle class="bar" cx="100" cy="100" r="' + RING_R + '" ' +
            'stroke-dasharray="' + RING_C.toFixed(2) + '" stroke-dashoffset="0"></circle>' +
        "</svg>" +
        '<p class="ring-time" id="ringTime">' + fmtClock(opts.seconds) + "</p>" +
      "</div>" +
      cueHtml +
      '<div class="timer-actions" id="timerActions"></div>' +
      '<p class="timer-note" id="timerNote"></p>';

    document.body.appendChild(wrap);
    overlay = {
      root: wrap,
      ring: wrap.querySelector(".bar"),
      ringWrap: wrap.querySelector(".ring-wrap"),
      time: wrap.querySelector("#ringTime"),
      actions: wrap.querySelector("#timerActions"),
      note: wrap.querySelector("#timerNote"),
      cues: Array.prototype.slice.call(wrap.querySelectorAll(".cue")),
      total: opts.seconds
    };
    return overlay;
  }

  // 时间到：整屏切到「结束」状态（闪烁 + 横幅），比只换一行小字明确得多
  function setDone(title, sub) {
    if (!overlay) return;
    var t = overlay.root.querySelector("#timeupTitle");
    var sb = overlay.root.querySelector("#timeupSub");
    if (t) t.textContent = title;
    if (sb) sb.textContent = sub || "";
    overlay.root.classList.add("is-done");
    // 同步给读屏软件
    overlay.root.setAttribute("aria-label", title);
    overlay.root.setAttribute("aria-live", "assertive");
  }

  // 加时 / 重开：退回进行中状态
  function setLive() {
    if (!overlay) return;
    overlay.root.classList.remove("is-done");
    overlay.root.setAttribute("aria-live", "off");
  }

  function destroyOverlay() {
    stopAlert();
    if (overlay && overlay.root && overlay.root.parentNode) {
      overlay.root.parentNode.removeChild(overlay.root);
    }
    overlay = null;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function paintTimer(remaining) {
    if (!overlay) return;
    var ratio = overlay.total > 0 ? clamp(remaining / overlay.total, 0, 1) : 0;
    overlay.ring.setAttribute("stroke-dashoffset", (RING_C * (1 - ratio)).toFixed(2));
    overlay.time.textContent = fmtClock(remaining);
    var critical = remaining <= 10;
    var warning = !critical && remaining <= 20;
    overlay.ringWrap.classList.toggle("is-warning", warning);
    overlay.ringWrap.classList.toggle("is-critical", critical);
    overlay.time.classList.toggle("is-critical", critical);
    state.remaining = remaining;
    state.elapsed = overlay.total - remaining;
    updateCues();
  }

  function updateCues() {
    if (!overlay || !overlay.cues.length) return;
    var total = overlay.total;
    var used = total - state.remaining;
    var active;
    if (total <= 0) active = 0;
    else {
      var third = total / 3;
      active = used >= third * 2 ? 2 : used >= third ? 1 : 0;
    }
    overlay.cues.forEach(function (c, i) { c.classList.toggle("is-active", i === active); });
  }

  function setActions(html) { if (overlay) overlay.actions.innerHTML = html; }
  function setNote(text) { if (overlay) overlay.note.textContent = text || ""; }

  /* ---------- 先查再讲：研究倒计时 ---------- */

  function beginResearch() {
    state.phase = "research";
    renderAll();
    buildOverlay({ label: "研究时间", seconds: state.researchSeconds, cues: false });
    overlay.root.setAttribute("aria-label", "研究倒计时");
    toneStart();   // 之前这条路径没有任何声音反馈，点了开始像是没反应

    var extra = 0;

    function actionsHtml() {
      return '<button type="button" class="btn primary" id="ovReady">研究完了，开始讲</button>' +
        '<div class="row">' +
        '<button type="button" class="btn secondary" id="ovMore">再加 5 分钟</button>' +
        '<button type="button" class="btn ghost" id="ovQuit">退出</button>' +
        "</div>";
    }

    function wire() {
      setActions(actionsHtml());
      var ready = overlay.root.querySelector("#ovReady");
      var more = overlay.root.querySelector("#ovMore");
      var quit = overlay.root.querySelector("#ovQuit");
      if (ready) ready.addEventListener("click", function () {
        stopTick();
        // 真正开讲的时刻，研究阶段不计入讲演时长
        if (state.session) state.session.speechStartedAt = Date.now();
        beginSpeech(true);
      });
      if (more) more.addEventListener("click", function () { addTime(300); });
      if (quit) quit.addEventListener("click", function () { stopTick(); endSession(); });
      if (ready) ready.focus();
    }

    function addTime(sec) {
      extra += sec;
      stopAlert();   // 先停报警，再延长
      setLive();
      overlay.total = state.remaining + sec;
      countdown(state.remaining + sec, paintTimer, onResearchDone);
      setNote("已延长到 " + fmtText(overlay.total) + "，随时可以点「研究完了」。");
      wire();
    }

    function onResearchDone() {
      toneDone();
      startAlert();
      setDone("研究时间到", "查了 " + fmtText(overlay.total) + " · 想继续就再加 5 分钟，或直接开口");
      setNote("研究时间到。再加时间继续查，或者直接点「研究完了，开始讲」。");
      wire();
    }

    setNote("研究结束后点按钮开始讲，题目会一直留在屏幕上。");
    wire();
    countdown(state.researchSeconds, paintTimer, onResearchDone);

    overlay.root.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.preventDefault(); stopTick(); endSession(); }
    });
  }

  /* ---------- 演讲计时 ---------- */

  function beginSpeech(fromResearchReady) {
    state.phase = "speech";
    renderAll();
    buildOverlay({
      label: fromResearchReady ? "准备好了，开始讲" : "演讲时间",
      seconds: state.speechSeconds,
      cues: true
    });
    overlay.root.setAttribute("aria-label", "演讲计时");
    toneStart();

    var over = 0;
    // 是否已经到过时间点。提前结束（还没到点）时 completed=false；
    // 到点后再点「讲完了」则 completed=true。加时会让它回到 false。
    var finished = false;

    function wire(ended) {
      setActions(
        '<button type="button" class="btn ' + (ended ? "primary" : "secondary") + '" id="ovStop">' +
          (ended ? "讲完了" : "提前结束") + "</button>" +
        '<button type="button" class="btn ' + (ended ? "secondary" : "ghost") + '" id="ovExtend">' +
          (ended ? "再讲 30 秒" : "加 30 秒") + "</button>"
      );
      overlay.root.querySelector("#ovStop").addEventListener("click", function () {
        stopTick();
        // 提前结束：completed=false，但仍记一条（能看到半途而废的比例）
        commitSession(finished);
        endSession();
      });
      overlay.root.querySelector("#ovExtend").addEventListener("click", function () {
        over += 30;
        if (state.session) state.session.extended += 1;
        finished = false;   // 又开始讲了，这一轮不再算「到过点」
        // 顺序很重要：先停掉重复报警，再发提示音，
        // 否则提示音的短振动会混进报警节奏里，看起来像「停了还在响」
        stopAlert();
        setLive();
        setNote("");
        toneStart();
        // 已归零时重新给 30 秒，否则在原倒计时上顺延
        countdown(ended ? 30 : state.remaining + 30, paintTimer, onSpeechDone);
        wire(false);
      });
      var stop = overlay.root.querySelector("#ovStop");
      if (stop) stop.focus();
    }

    function onSpeechDone() {
      toneDone();
      startAlert();
      finished = true;
      // 算真实讲了多少：原始时长 + 加时（如果时间到之后又重开，则从重开点累加）
      overlay.total = state.speechSeconds + over;
      setDone("时间到", "这轮一共 " + fmtText(overlay.total) +
        (over > 0 ? "（含加时）" : "") + " · 讲完了就点下面");
      wire(true);
    }

    wire(false);
    countdown(state.speechSeconds, paintTimer, onSpeechDone);

    overlay.root.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.preventDefault(); stopTick(); endSession(); }
    });
  }

  function endSession(recordingDone) {
    stopTick();
    stopAlert();
    // 若调用方还没落库（比如按 Esc 退出），这里补一条未完成记录
    if (!recordingDone) commitSession(false);
    destroyOverlay();
    state.phase = "idle";
    state.remaining = state.speechSeconds;
    state.elapsed = 0;
    renderAll();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.phase !== "idle") {
      e.preventDefault();
      endSession();
      return;
    }
    if (state.phase !== "idle") return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;

    if (e.code === "Space") {
      if (e.target && e.target.tagName === "BUTTON") return;
      e.preventDefault();
      spin();
    } else if (e.key === "Enter") {
      if (e.target && e.target.tagName === "BUTTON") return;
      if (state.topic && !isBusy()) { e.preventDefault(); startSession(); }
    }
  });

  function fmtTime(iso) {
    var d = new Date(iso);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function dayLabel(key) {
    var today = dayKey(new Date());
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (key === today) return "今天";
    if (key === dayKey(y)) return "昨天";
    var parts = key.split("-");
    return Number(parts[1]) + " 月 " + Number(parts[2]) + " 日";
  }

  function exportHistory() {
    if (!state.history.length) return;
    var lines = ["# 即兴一分钟 · 练习记录", "", "导出时间：" + new Date().toLocaleString("zh-CN"), ""];
    var st = historyStats();
    lines.push("- 共 **" + st.total + "** 次练习，完成率 " + st.completionRate + "%");
    lines.push("- 本周 " + st.week + " 次，连续 " + st.streak + " 天");
    lines.push("- 累计讲 **" + fmtDuration(st.totalSec) + "**");
    lines.push("", "| 时间 | 题目 | 分类 | 时长 | 状态 |", "|---|---|---|---|---|");
    state.history.slice().reverse().forEach(function (r) {
      var d = new Date(r.at);
      var ts = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0") + " " + fmtTime(r.at);
      lines.push("| " + ts + " | " + r.topic + (r.prompt ? "（" + r.prompt + "）" : "") + " | " + (r.category || "-") + " | " +
        fmtDuration(r.durationSec) + " | " + (r.completed ? "讲完" : "中途结束") + " |");
    });
    var blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "即兴一分钟-练习记录-" + dayKey(new Date()) + ".md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function openHistory() {
    if (isBusy()) return;
    var wrap = document.createElement("div");
    wrap.className = "overlay";
    wrap.setAttribute("role", "presentation");

    var st = historyStats();
    var listHtml;

    if (!state.history.length) {
      listHtml = '<div class="hempty"><strong>还没有练习记录</strong>' +
        '点「抽一个题」再点「开始计时」，讲完就会记一条。<br />' +
        '只记真正开始计时的练习，抽了没讲的不算。</div>';
    } else {
      // 按日期分组，最近一天在最上面
      var groups = [];
      var byDay = {};
      state.history.forEach(function (r) {
        var k = dayKey(r.at);
        if (!byDay[k]) { byDay[k] = []; groups.push(k); }
        byDay[k].push(r);
      });
      groups.sort(function (a, b) { return b.localeCompare(a); });
      var html = "";
      groups.forEach(function (k) {
        var rs = byDay[k].slice().reverse();
        html += '<div class="hday"><span>' + dayLabel(k) + "</span>" +
          '<span class="hday-count">' + rs.length + " 次</span></div>";
        rs.forEach(function (r) {
          html += '<div class="hitem' + (r.completed ? "" : " is-partial") + '">' +
            '<span class="hitem-dot" aria-hidden="true"></span>' +
            '<span class="hitem-topic" title="' + escapeHtml(r.topic + (r.prompt ? "｜" + r.prompt : "")) + '">' +
              escapeHtml(r.topic) +
              (r.prompt ? '<span class="hitem-prompt">' + escapeHtml(r.prompt) + "</span>" : "") + "</span>" +
            (r.category ? '<span class="hitem-cat">' + escapeHtml(r.category) + "</span>" : "") +
            '<span class="hitem-meta">' + fmtDuration(r.durationSec) +
              (r.completed ? "" : " · 未讲完") + "<br />" + fmtTime(r.at) + "</span>" +
            "</div>";
        });
      });
      listHtml = '<div class="hlist">' + html + "</div>";
    }

    wrap.innerHTML =
      '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="hisTitle">' +
        '<div class="panel-head-row">' +
          "<div>" +
            '<h2 id="hisTitle">练习记录</h2>' +
            "<p>" + (state.history.length
              ? "共 " + st.total + " 次，最近 " + Math.min(st.total, HISTORY_MAX) + " 条保留在本地"
              : "记录保存在这台设备上，不上传") + "</p>" +
          "</div>" +
          '<button type="button" class="icon-btn" id="hisClose" aria-label="关闭">' + I.close + "</button>" +
        "</div>" +

        (state.history.length ?
        '<div class="hstats">' +
          '<div class="hstat"><span class="hstat-num">' + st.week + '</span><span class="hstat-label">本周次数</span></div>' +
          '<div class="hstat"><span class="hstat-num">' + st.streak + '</span><span class="hstat-label">连续天数</span></div>' +
          '<div class="hstat"><span class="hstat-num">' + st.completionRate + '%</span><span class="hstat-label">讲完比例</span></div>' +
        "</div>" : "") +

        listHtml +

        (state.history.length ?
        '<div class="timer-actions" style="max-width:none;margin-top:20px">' +
          '<div class="row">' +
            '<button type="button" class="btn secondary" id="hisExport">' + I.download + "导出 Markdown</button>" +
            '<button type="button" class="btn ghost" id="hisClear">' + I.trash + "清空</button>" +
          "</div>" +
        "</div>" : "") +

        '<p class="panel-note">' + "只有点过「开始计时」的练习才会记录。" +
          (state.history.length ? "累计讲了 " + fmtDuration(st.totalSec) + "。" : "") + "</p>" +
      "</div>";

    document.body.appendChild(wrap);
    var panel = wrap.querySelector(".panel");

    function shutdown() {
      document.removeEventListener("keydown", onKey);
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      if (el.historyBtn) el.historyBtn.focus();
    }

    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); shutdown(); }
      else if (e.key === "Tab") {
        var f = Array.prototype.slice.call(panel.querySelectorAll("button, input, [tabindex]"))
          .filter(function (n) { return !n.disabled; });
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }

    wrap.querySelector("#hisClose").addEventListener("click", shutdown);
    wrap.addEventListener("mousedown", function (e) { if (e.target === wrap) shutdown(); });
    document.addEventListener("keydown", onKey);

    var exp = wrap.querySelector("#hisExport");
    if (exp) exp.addEventListener("click", exportHistory);

    var clr = wrap.querySelector("#hisClear");
    if (clr) {
      clr.addEventListener("click", function () {
        if (clr.dataset.armed !== "1") {
          clr.dataset.armed = "1";
          clr.textContent = "再点一次确认清空";
          setTimeout(function () {
            if (clr.dataset.armed === "1") { clr.dataset.armed = ""; clr.textContent = "清空"; }
          }, 4000);
          return;
        }
        state.history = [];
        saveHistory();
        renderHistoryButton();
        shutdown();
      });
    }

    wrap.querySelector("#hisClose").focus();
  }

          '<div class="duration-ends" aria-hidden="true"><span>1 分</span><span>30 分</span></div>' +
          '<p class="duration-hint">只在「先查再讲」模式用得上。研究中途还能再加时间。</p>' +

          '<p class="field-hint">点一个就会响一声。不满意可以随时换。</p>' +
        "</div>" +

        '<p class="panel-note">全部存在浏览器本地，不上传任何东西。</p>' +
        '<div class="panel-foot">' +
          '<button type="button" class="btn primary" id="setDone" style="width:100%">完成</button>' +
        "</div>" +

    document.body.appendChild(wrap);

    var panel = wrap.querySelector(".panel");
    var pickList = wrap.querySelector("#pickList");

    // 吸底按钮会盖住最后几行，按它的实际高度补足面板底部空间。
    // 不写死数值：按钮高度受字体、文案折行影响，量出来才可靠。
    function padForFooter() {
      var foot = wrap.querySelector(".panel-foot");
      if (!foot) return;
      var h = Math.ceil(foot.getBoundingClientRect().height);
      if (h > 0) panel.style.paddingBottom = (h + 8) + "px";
    }

    // 每次变化整块重绘：状态驱动，避免逐项同步漏掉边界情况
    function renderPick() {
      var on = enabledNiches();
      var lastOne = state.enabled.length === 1;
      var isAll = state.scope === "all";

      // 「全部」行：用 NICHES 的总题量（不是 activePool，避免和 scope 循环依赖）
      var allRow = wrap.querySelector("#pickAllScope");
      var allCount = NICHES.reduce(function (a, n) { return a + n.topics.length; }, 0);
      allRow.classList.toggle("is-on", isAll);
      allRow.setAttribute("aria-checked", isAll ? "true" : "false");
      wrap.querySelector("#allScopeNum").textContent = NICHES.length + " 类 · " + allCount + " 题";

      pickList.innerHTML = NICHES.map(function (n) {
        // 全部模式下不高亮任何单项：此时勾选状态不代表实际范围
        var active = !isAll && state.enabled.indexOf(n.id) >= 0;
        // 只剩一个开启时，把它自己禁掉，给出明确反馈而不是静默无反应
        var locked = active && lastOne;
        return '<button type="button" class="pick-item' + (active ? " is-on" : "") + '"' +
          ' data-niche="' + n.id + '"' +
          ' role="checkbox" aria-checked="' + (active ? "true" : "false") + '"' +
          (locked ? ' aria-disabled="true"' : "") +

          '<span class="pick-box" aria-hidden="true"></span>' +

          '<span class="pick-name">' + n.label + "</span>" +
          '<span class="pick-num">' + n.topics.length + "</span>" +
          "</button>";
      }).join("");

      var total = activePool().length;
      // 题量已经在大字上显示了，提示里不重复，只讲「当前范围是什么」
      var head;
      if (isAll) {
        head = "默认全部分类混合抽题，每题等概率。想只练某几块，点下面的分类。";
      } else if (lastOne) {
        head = "只在「" + on[0].label + "」里抽。至少保留一个分类，想换就开别的再关这个。";
      } else {
        head = "只在勾选的 " + on.length + " 个分类里抽，每题等概率。";
      }
      pickHint.textContent = head;

      padForFooter();

      Array.prototype.forEach.call(pickList.querySelectorAll(".pick-item"), function (btn) {
        btn.addEventListener("click", function () {
          if (!toggleNiche(btn.dataset.niche)) {
            pickHint.textContent = "至少要保留一个分类。先开另一个，再关这个。";
            var el2 = btn;
            el2.animate && el2.animate(
              [{ transform: "translateX(0)" }, { transform: "translateX(-3px)" },
               { transform: "translateX(3px)" }, { transform: "translateX(0)" }],
              { duration: 220, easing: "ease-out" });
            return;
          }
          renderPick();
        });
        btn.addEventListener("keydown", function (e) {
          var all = Array.prototype.slice.call(pickList.querySelectorAll(".pick-item"));
          var at = all.indexOf(btn);
          if (e.key === "ArrowDown") { e.preventDefault(); all[Math.min(all.length - 1, at + 1)].focus(); }
          else if (e.key === "ArrowUp") { e.preventDefault(); all[Math.max(0, at - 1)].focus(); }
        });
      });
    }
    renderPick();
    requestAnimationFrame(padForFooter);
    if (window.ResizeObserver) {
      try {
        new ResizeObserver(padForFooter).observe(wrap.querySelector(".panel-foot"));
      } catch (e) {}
    }

    wrap.querySelector("#pickAllScope").addEventListener("click", function () {
      setScopeAll();
      renderPick();
    });

    var speechInput = wrap.querySelector("#setSpeech");
    var researchInput = wrap.querySelector("#setResearch");
    var mutedInput = wrap.querySelector("#setMuted");
    var spinSoundInput = wrap.querySelector("#setSpinSound");

    function paintFill(input) {
      var min = Number(input.min) || 0;
      var max = Number(input.max) || 100;
      var v = Number(input.value);
      var pct = max > min ? ((v - min) / (max - min)) * 100 : 0;
      input.style.setProperty("--pct", pct.toFixed(2) + "%");
    }
    paintFill(speechInput);
    paintFill(researchInput);

    Array.prototype.forEach.call(wrap.querySelectorAll(".theme-seg button"), function (btn) {
      btn.addEventListener("click", function () {
        state.theme = btn.dataset.theme;
        save("theme", state.theme);
        applyAppearance();
        Array.prototype.forEach.call(wrap.querySelectorAll(".theme-seg button"), function (b) {
          b.classList.toggle("is-on", b === btn);
        });
      });
    });

    Array.prototype.forEach.call(wrap.querySelectorAll(".swatch"), function (btn) {
      btn.addEventListener("click", function () {
        state.palette = btn.dataset.palette;
        save("palette", state.palette);
        applyAppearance();
        Array.prototype.forEach.call(wrap.querySelectorAll(".swatch"), function (b) {
          var on = b === btn;
          b.classList.toggle("is-on", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
      });
      btn.addEventListener("keydown", function (e) {
        var all = Array.prototype.slice.call(wrap.querySelectorAll(".swatch"));
        var at = all.indexOf(btn);
        if (e.key === "ArrowRight" || e.key === "ArrowDown") {
          e.preventDefault(); all[(at + 1) % all.length].focus();
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault(); all[(at - 1 + all.length) % all.length].focus();
        }
      });
    });

    speechInput.addEventListener("input", function () {
      state.speechSeconds = Number(speechInput.value) * 60;
      wrap.querySelector("#speechVal").textContent = fmtText(state.speechSeconds);
      save("speech", state.speechSeconds);
      paintFill(speechInput);
      renderButtons();
    });

    researchInput.addEventListener("input", function () {
      state.researchSeconds = Number(researchInput.value) * 60;
      wrap.querySelector("#researchVal").textContent = fmtText(state.researchSeconds);
      save("research", state.researchSeconds);
      paintFill(researchInput);
      renderButtons();
    });

    mutedInput.addEventListener("change", function () {
      state.muted = mutedInput.checked;
      save("muted", state.muted);
      // 全部静音时，齿轮声开关跟着置灰（仍保留用户此前的选择）
      if (spinSoundInput) {
        spinSoundInput.disabled = state.muted;
        if (state.muted) stopSpinSound();
      }
      renderTones();
    });

    // 音色列表（试听时会响一声，所以必须在用户点击里调用）
    var toneList = wrap.querySelector("#toneList");
    var toneField = wrap.querySelector("#toneField");
    function renderTones() {
      toneList.innerHTML = Object.keys(TONES).map(function (id) {
        return '<button type="button" class="tone-chip' + (state.spinTone === id ? " is-on" : "") +
          '" data-tone="' + id + '" role="radio" aria-checked="' + (state.spinTone === id ? "true" : "false") + '">' +
          toneDef(id).name + "</button>";
      }).join("");
      var off = state.muted || !state.spinSound;
      Array.prototype.forEach.call(toneList.querySelectorAll(".tone-chip"), function (btn) {
        btn.disabled = off;
        btn.addEventListener("click", function () {
          state.spinTone = btn.dataset.tone;
          save("spinTone", state.spinTone);
          renderTones();
          // 立即响一声，方便判断
          lastTickWall = -1e9;
          playTick(1);
        });
      });
      if (tonePreview) tonePreview.disabled = off;
    }
    var tonePreview = wrap.querySelector("#tonePreview");
    renderTones();
    if (tonePreview) {
      tonePreview.addEventListener("click", function () {
        lastTickWall = -1e9;
        playTick(1);
      });
    }

    if (spinSoundInput) {
      spinSoundInput.addEventListener("change", function () {
        state.spinSound = spinSoundInput.checked;
        save("spinSound", state.spinSound);
        if (!state.spinSound) stopSpinSound();
        renderTones();
      });
    }

    function shutdown() {
      document.removeEventListener("keydown", onKey);
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      el.settingsBtn.focus();
    }

    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); shutdown(); }
      else if (e.key === "Tab") {
        var f = Array.prototype.slice.call(panel.querySelectorAll("button, input, [tabindex]"))
          .filter(function (n) { return !n.disabled; });
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }

    wrap.querySelector("#setDone").addEventListener("click", shutdown);
    wrap.addEventListener("mousedown", function (e) {
      if (e.target === wrap) shutdown();
    });
    document.addEventListener("keydown", onKey);
    speechInput.focus();
  }

  /* ============================================================
     启动
     ============================================================ */

  if (state.mode !== "off-the-cuff" && state.mode !== "deep-research") state.mode = "off-the-cuff";
  if (!NICHES.some(function (n) { return n.id === state.niche; })) state.niche = NICHES[0].id;
  ensureMinNiches();
  // 上次选的分类若已被关掉，落到第一个还开着的
  if (state.enabled.indexOf(state.niche) < 0) state.niche = state.enabled[0];

  applyAppearance();
  renderHistoryButton();

  var initial = pick(activeTopics());
  lastIndex = activeTopics().indexOf(initial);
  setTopic(initial);
  state.topic = null;
  el.reelPhrase.textContent = "点击抽题";
  renderAll();

  window.addEventListener("pagehide", clearSpin);
})();
</script>
</body>
</html>
