<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>手机音频诊断 — 即兴一分钟</title>
<style>
  :root{--bg:#0a0d0c;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.11);
        --text:#f2f6f4;--text2:#a9b6b0;--text3:#7c8883;--c:#4aa8ff;
        --wash:rgba(74,168,255,.12);--edge:rgba(74,168,255,.32);
        --ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb84d}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC",system-ui,-apple-system,sans-serif;background:var(--bg);
       color:var(--text);line-height:1.6;padding:20px 16px 50px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:19px;font-weight:700}
  .sub{color:var(--text3);font-size:13px;margin-top:5px}
  .big{display:block;width:100%;margin:18px 0;padding:20px;font-family:inherit;
       font-size:17px;font-weight:700;color:#04140c;cursor:pointer;border:0;border-radius:16px;
       background:linear-gradient(180deg,#86c8ff,#4aa8ff 46%,#1d6fc4);
       box-shadow:0 8px 26px rgba(74,168,255,.32)}
  .big:active{transform:scale(.985)}
  .card{margin-top:14px;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .card h2{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:9px;
           display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
       border-top:1px solid rgba(255,255,255,.055);font-size:13px}
  .row:first-of-type{border-top:0}
  .row .k{color:var(--text3);flex:0 0 auto}
  .row .v{text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
  .verdict{margin-top:14px;padding:14px 15px;border-radius:14px;font-size:13.5px;line-height:1.75}
  .verdict.good{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.35)}
  .verdict.bad{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35)}
  .verdict.warn{background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.35)}
  .verdict b{display:block;margin-bottom:4px;font-size:14.5px}
  .note{color:var(--text3);font-size:12px;margin-top:12px;line-height:1.75}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:rgba(255,255,255,.07);
       padding:1px 5px;border-radius:4px}
  .steps{margin:8px 0 0 18px;font-size:13px;color:var(--text2)}
  .steps li{margin:3px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>手机音频诊断</h1>
  <p class="sub">点下面的按钮，把结果告诉我。这个页面就是用来定位「为什么没声音」的。</p>

  <button class="big" id="go">▶ 点我：测试声音 + 生成报告</button>

  <div class="card">
    <h2>音频环境</h2>
    <div id="env"></div>
  </div>

  <div class="verdict" id="verdict" style="display:none"></div>

  <div class="card">
    <h2>报告文本 <span style="font-weight:400;color:var(--text3);font-size:11.5px">（可以直接发给我）</span></h2>
    <div class="row"><span class="v" id="report" style="text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65">（点上面的按钮生成）</span></div>
  </div>

  <p class="note">
    <b>先说结论方向</b>，这样你看到结果能自己判断：<br />
    ① <code>state=interrupted</code> 或 <code>suspended</code> 且 resume 失败 → 多半是
    <b>iPhone 侧面的静音开关拨到了静音</b>（这是最常见的原因，Web Audio 会被直接掐掉）<br />
    ② <code>state=running</code> 但听不到 → 音量、蓝牙耳机、或者「静音全部声音」开关被打开了<br />
    ③ 不支持 AudioContext → 浏览器太旧
  </p>
</div>

<script>
(function () {
  "use strict";
  var ctx = null;

  function el(id) { return document.getElementById(id); }
  function row(k, v, cls) {
    return '<div class="row"><span class="k">' + k + '</span><span class="v ' +
      (cls || '') + '">' + v + '</span></div>';
  }

  function envInfo() {
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua);
    var ver = (ua.match(/OS (\d+)[._](\d+)/) || [])[0] || "?";
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var h = "";
    h += row("设备", ios ? "iOS " + ver.replace("OS ", "").replace("_", ".") : (/Android/.test(ua) ? "Android" : "其它"));
    h += row("浏览器", /CriOS/.test(ua) ? "Chrome" : /FxiOS/.test(ua) ? "Firefox" : ios ? "Safari" : "其它");
    h += row("支持 AudioContext", Ctx ? "支持" : "不支持", Ctx ? "ok" : "bad");
    h += row("支持振动", navigator.vibrate ? "支持" : "不支持（iOS 一直没有）");
    h += row("页面协议", location.protocol, location.protocol === "https:" || location.protocol === "file:" ? "ok" : "warn");
    return h;
  }

  function report(data) {
    var lines = [];
    for (var k in data) lines.push(k + ": " + data[k]);
    return lines.join("\n");
  }

  el("go").addEventListener("click", function () {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var out = {};
    el("env").innerHTML = envInfo();

    if (!Ctx) {
      el("verdict").style.display = "block";
      el("verdict").className = "verdict bad";
      el("verdict").innerHTML = "<b>浏览器不支持 Web Audio</b>这个浏览器太旧了，换 Safari 或 Chrome。";
      return;
    }

    if (!ctx) ctx = new Ctx();
    out["1_创建时state"] = ctx.state;
    out["2_sampleRate"] = ctx.sampleRate;

    // 依次尝试：resume → 静音缓冲预热 → 真正发声
    var steps = [];
    function finish() {
      out["3_resume后state"] = ctx.state;
      out["4_预热是否成功"] = steps.indexOf("prime-ok") >= 0 ? "是" : "否";
      out["5_发声是否成功"] = steps.indexOf("tone-ok") >= 0 ? "是" : "否";
      out["6_最终state"] = ctx.state;
      out["7_尝试过程"] = steps.join(",") || "（无）";

      var state = ctx.state;
      var v = el("verdict");
      v.style.display = "block";

      if (state !== "running") {
        v.className = "verdict bad";
        v.innerHTML = '<b>音频被系统挡住了（state=' + state + '）</b>' +
          '<ul class="steps">' +
          '<li><b>先检查 iPhone 侧面那个静音拨片</b>——它在静音档时，网页声音会被系统直接掐掉，而且不报错。这是最常见的原因。</li>' +
          '<li>再检查「低电量模式」，它有时会阻止音频启动。</li>' +
          '<li>如果插着耳机或连着蓝牙，拔掉/断开再试。</li>' +
          '<li>把音量键按大两下。</li>' +
          '<li>还不行就重启 Safari（完全关掉再打开）。</li>' +
          '</ul>';
      } else if (steps.indexOf("tone-ok") >= 0) {
        v.className = "verdict good";
        v.innerHTML = '<b>音频环境正常，确实发声了</b>' +
          '你刚才应该听到「嘟——」的一声。如果听到了，说明手机没问题，' +
          '那就是应用里某个开关被关掉了：去「设置」看这两个——' +
          '<ul class="steps">' +
          '<li>「静音全部声音」是不是被打开了</li>' +
          '<li>「抽题时播放声音」是不是被关掉了</li>' +
          '</ul>';
      } else {
        v.className = "verdict warn";
        v.innerHTML = '<b>能启动但发声失败</b>把下面的报告发我，我照着改。';
      }

      el("report").textContent = report(out);
      el("env").innerHTML = envInfo() + row("当前 state", state,
        state === "running" ? "ok" : "bad");
    }

    function prime(next) {
      try {
        var b = ctx.createBuffer(1, 1, ctx.sampleRate);
        var s = ctx.createBufferSource();
        s.buffer = b;
        s.connect(ctx.destination);
        s.start(0);
        steps.push("prime-ok");
      } catch (e) { steps.push("prime-fail:" + (e && e.name)); }
      next();
    }

    function tone() {
      try {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = 440;
        var t = ctx.currentTime;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        g.gain.setValueAtTime(0.35, t + 0.45);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.7);
        setTimeout(function () { steps.push("tone-ok"); finish(); }, 300);
      } catch (e) {
        steps.push("tone-fail:" + (e && e.name));
        finish();
      }
    }

    if (ctx.state === "running") {
      prime(tone);
    } else {
      var p;
      try { p = ctx.resume(); } catch (e) { steps.push("resume-throw"); }
      if (p && p.then) {
        p.then(function () { prime(tone); }, function () { prime(tone); });
      } else {
        setTimeout(function () { prime(tone); }, 120);
      }
      // 兜底：resume 不 settle 时也要继续，否则页面就卡在这
      setTimeout(function () { if (steps.indexOf("tone-ok") < 0 && steps.indexOf("tone-fail") < 0) prime(tone); }, 900);
    }
  });

  el("env").innerHTML = envInfo();
})();
</script>
</body>
</html>
